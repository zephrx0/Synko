name: Build Synko
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Verify packaged UI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/Synko-win-x64/Synko.exe'
          $output = Join-Path $PWD 'artifacts/production-check'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-ui', $output) -Wait -PassThru
          if (Test-Path (Join-Path $output 'production-error.txt')) { throw (Get-Content (Join-Path $output 'production-error.txt') -Raw) }
          if (-not (Test-Path (Join-Path $output 'production-checks.json'))) { throw 'No UI verification report was produced.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Synko-win-x64
          path: |
            artifacts/Synko-win-x64.zip
            artifacts/Synko-*-win-x64.exe
            artifacts/Synko-*-win-x64.sha256
            artifacts/production-check/production-checks.json
